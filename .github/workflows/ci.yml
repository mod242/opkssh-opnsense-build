name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Reproducible build (freebsd/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable   # bootstrap only; build.sh switches to the toolchain from opkssh's go.mod
          cache: false
      - name: Build twice and compare
        run: ./build.sh
      - name: Summary
        run: |
          {
            echo '### opkssh FreeBSD build'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opkssh-freebsd-amd64
          path: dist/
          if-no-files-found: error

  freebsd:
    name: Test on FreeBSD 15.1
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opkssh-freebsd-amd64
          path: dist
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          copyback: false
          prepare: pkg install -y git go jq
          run: |
            set -eu
            v=$(sed -n 's/^OPKSSH_VERSION=//p' versions.env)
            chmod 0755 "dist/opkssh-$v-freebsd-amd64"
            freebsd-version
            sh test/freebsd-smoke.sh "dist/opkssh-$v-freebsd-amd64" "$v"
            sh test/freebsd-gotest.sh
